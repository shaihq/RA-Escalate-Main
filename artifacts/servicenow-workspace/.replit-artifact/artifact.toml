kind = "web"
previewPath = "/"
title = "CSM/FSM Workspace"
version = "1.0.0"
id = "artifacts/servicenow-workspace"
router = "path"

[[integratedSkills]]
name = "react-vite"
version = "1.0.0"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 23352

[services.development]
run = "pnpm --filter @workspace/servicenow-workspace run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/servicenow-workspace", "run", "build" ]
publicDir = "artifacts/servicenow-workspace/dist/public"
serve = "static"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "23352"
BASE_PATH = "/"
